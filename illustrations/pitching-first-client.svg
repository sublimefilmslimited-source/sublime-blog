    <rect x="840" y="390" width="72" height="72" rx="8" fill="#ffffff"/>
    <rect x="850" y="402" width="52" height="8" rx="4" fill="#d80707"/>
    <rect x="850" y="418" width="40" height="6" rx="3" fill="#c9cacd"/>
    <rect x="850" y="430" width="46" height="6" rx="3" fill="#c9cacd"/>
    <rect x="850" y="442" width="34" height="6" rx="3" fill="#c9cacd"/>
    <rect x="924" y="408" width="74" height="10" rx="5" fill="#0b0b0c" opacity=".75"/>
    <rect x="924" y="428" width="50" height="8" rx="4" fill="#0b0b0c" opacity=".45"/>
