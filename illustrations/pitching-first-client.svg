      <g fill="#ffffff"><rect x="132.5" y="264" width="52.5" height="40"/><rect x="237.5" y="264" width="52.5" height="40"/><rect x="342.5" y="264" width="52.5" height="40"/><rect x="447.5" y="264" width="52.5" height="40"/></g>
    </g>
