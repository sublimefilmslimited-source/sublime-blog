    <circle cx="175" cy="402" r="8" fill="#d80707"/>
    <rect x="235" y="400" width="80" height="70" rx="6" fill="#6b3b22"/>
    <rect x="235" y="400" width="80" height="18" rx="6" fill="#ffffff"/>
    <rect x="235" y="430" width="80" height="8" fill="#f7c6cf"/>
    <circle cx="255" cy="394" r="7" fill="#d80707"/><circle cx="295" cy="394" r="7" fill="#d80707"/>
