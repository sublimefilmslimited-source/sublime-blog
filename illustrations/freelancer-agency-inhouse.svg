<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf2f2"/><stop offset="1" stop-color="#f5f5f6"/></linearGradient>
    <g id="head">
      <circle cx="0" cy="0" r="38" fill="#8a5636"/>
      <circle cx="-12" cy="2" r="4" fill="#1c120d"/><circle cx="12" cy="2" r="4" fill="#1c120d"/>
      <path d="M-10 18 Q0 25 10 18" fill="none" stroke="#1c120d" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1110" cy="90" r="170" fill="#d80707" opacity=".07"/>
  <polygon points="0,0 230,0 0,230" fill="#0b0b0c" opacity=".06"/>
  <g font-family="Gilroy, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <!-- panels -->
    <rect x="50" y="110" width="340" height="500" rx="28" fill="#fff" stroke="#e6e6e9" stroke-width="5"/>
    <rect x="430" y="90" width="340" height="540" rx="28" fill="#0b0b0c"/>
    <rect x="810" y="110" width="340" height="500" rx="28" fill="#fff" stroke="#e6e6e9" stroke-width="5"/>
    <text x="220" y="170" font-size="32" fill="#0b0b0c">Freelancer</text>
    <text x="600" y="152" font-size="32" fill="#fff">Agency</text>
    <text x="980" y="170" font-size="32" fill="#0b0b0c">In-house</text>
  </g>
  <!-- freelancer: young man with laptop -->
  <g>
    <path d="M140 470 C140 390 170 360 220 360 C270 360 300 390 300 470 Z" fill="#d80707"/>
    <rect x="208" y="320" width="24" height="44" rx="9" fill="#7a4a2e"/>
    <use href="#head" x="220" y="290"/>
    <path d="M182 280 C182 248 200 240 220 240 C242 240 258 248 258 280 C248 266 236 262 220 262 C204 262 192 266 182 280 Z" fill="#1c120d"/>
    <rect x="120" y="470" width="200" height="16" rx="8" fill="#0b0b0c"/>
    <rect x="150" y="400" width="140" height="74" rx="8" fill="#5d5f64"/>
    <circle cx="220" cy="437" r="12" fill="#fff"/>
    <rect x="150" y="510" width="140" height="44" rx="22" fill="#fdf2f2"/>
    <text x="220" y="540" text-anchor="middle" font-family="Gilroy, Arial, sans-serif" font-weight="700" font-size="22" fill="#d80707">₦</text>
  </g>
  <!-- agency: three people around a table -->
  <g>
    <!-- left -->
    <path d="M460 470 C460 410 482 385 515 385 C548 385 570 410 570 470 Z" fill="#d80707"/>
    <use href="#head" x="515" y="340"/>
    <path d="M477 335 C475 300 495 290 515 290 C537 290 556 300 553 335 C543 316 530 312 515 312 C500 312 487 316 477 335 Z" fill="#1c120d"/>
    <!-- middle (gele) -->
    <path d="M545 450 C545 380 570 350 600 350 C630 350 655 380 655 450 Z" fill="#ffd27a"/>
    <use href="#head" x="600" y="305"/>
    <path d="M560 296 C558 260 580 244 602 244 C628 244 646 262 640 296 C628 282 614 278 600 278 C586 278 572 282 560 296 Z" fill="#2f8f5b"/>
    <path d="M630 254 C652 240 666 256 654 274 Z" fill="#2f8f5b"/>
    <!-- right -->
    <path d="M630 470 C630 410 652 385 685 385 C718 385 740 410 740 470 Z" fill="#5d5f64"/>
    <use href="#head" x="685" y="340"/>
    <circle cx="685" cy="305" r="30" fill="#1c120d"/>
    <circle cx="660" cy="290" r="18" fill="#1c120d"/><circle cx="710" cy="290" r="18" fill="#1c120d"/>
    <!-- table -->
    <rect x="455" y="465" width="290" height="24" rx="12" fill="#fff"/>
    <rect x="500" y="430" width="70" height="40" rx="6" fill="#c9cacd"/>
    <rect x="625" y="425" width="34" height="48" rx="6" fill="#d80707"/>
    <!-- skill tags -->
    <g font-family="Gilroy, Arial, sans-serif" font-weight="700" font-size="18" text-anchor="middle">
      <rect x="470" y="520" width="120" height="38" rx="19" fill="#d80707"/><text x="530" y="545" fill="#fff">Strategy</text>
      <rect x="610" y="520" width="120" height="38" rx="19" fill="#fff"/><text x="670" y="545" fill="#0b0b0c">Video</text>
      <rect x="470" y="570" width="120" height="38" rx="19" fill="#fff"/><text x="530" y="595" fill="#0b0b0c">Ads</text>
      <rect x="610" y="570" width="120" height="38" rx="19" fill="#d80707"/><text x="670" y="595" fill="#fff">Reports</text>
    </g>
  </g>
  <!-- in-house: woman at a desk with ID badge -->
  <g>
    <path d="M900 470 C900 390 930 360 980 360 C1030 360 1060 390 1060 470 Z" fill="#0b0b0c"/>
    <rect x="968" y="320" width="24" height="44" rx="9" fill="#7a4a2e"/>
    <use href="#head" x="980" y="290"/>
    <circle cx="980" cy="246" r="32" fill="#1c120d"/>
    <path d="M940 282 C938 250 958 238 980 238 C1004 238 1022 250 1020 282 C1008 266 994 262 980 262 C966 262 952 266 940 282 Z" fill="#1c120d"/>
    <circle cx="942" cy="298" r="6" fill="#ffd27a"/>
    <rect x="1000" y="400" width="34" height="44" rx="5" fill="#fff"/>
    <rect x="1006" y="408" width="22" height="6" rx="3" fill="#d80707"/>
    <rect x="1006" y="420" width="22" height="4" rx="2" fill="#c9cacd"/>
    <line x1="1017" y1="400" x2="1000" y2="365" stroke="#d80707" stroke-width="3"/>
    <rect x="880" y="470" width="200" height="16" rx="8" fill="#0b0b0c"/>
    <!-- calendar -->
    <rect x="910" y="510" width="140" height="70" rx="10" fill="#fdf2f2"/>
    <rect x="910" y="510" width="140" height="18" rx="9" fill="#d80707"/>
    <g fill="#c9cacd"><rect x="925" y="540" width="20" height="12" rx="3"/><rect x="955" y="540" width="20" height="12" rx="3"/><rect x="985" y="540" width="20" height="12" rx="3"/><rect x="1015" y="540" width="20" height="12" rx="3"/><rect x="925" y="558" width="20" height="12" rx="3"/><rect x="955" y="558" width="20" height="12" rx="3"/></g>
  </g>
</svg>
