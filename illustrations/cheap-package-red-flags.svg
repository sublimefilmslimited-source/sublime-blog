<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf2f2"/><stop offset="1" stop-color="#f5f5f6"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="170" fill="#d80707" opacity=".08"/>
  <polygon points="0,0 230,0 0,230" fill="#0b0b0c" opacity=".06"/>
  <g font-family="Gilroy, Arial, sans-serif" font-weight="700">
    <!-- package card -->
    <rect x="110" y="140" width="380" height="440" rx="28" fill="#fff" stroke="#e6e6e9" stroke-width="5"/>
