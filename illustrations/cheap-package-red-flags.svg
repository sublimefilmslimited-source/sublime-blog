    <circle cx="420" cy="380" r="110" fill="#fdf2f2" fill-opacity=".55" stroke="#0b0b0c" stroke-width="14"/>
    <path d="M498 458 L570 530" stroke="#0b0b0c" stroke-width="30" stroke-linecap="round"/>
    <path d="M375 345 l30 30 M405 345 l-30 30" stroke="#d80707" stroke-width="10" stroke-linecap="round"/>
    <path d="M425 395 l30 30 M455 395 l-30 30" stroke="#d80707" stroke-width="10" stroke-linecap="round"/>
    <!-- red flags list -->
    <g>
      <rect x="660" y="150" width="440" height="100" rx="22" fill="#fff" stroke="#e6e6e9" stroke-width="4"/>
      <rect x="695" y="172" width="8" height="58" rx="4" fill="#0b0b0c"/>
      <path d="M703 174 h44 l-12 14 l12 14 h-44z" fill="#d80707"/>
      <text x="775" y="212" font-size="30" fill="#0b0b0c">Fake followers</text>
    </g>
    <g>
      <rect x="660" y="285" width="440" height="100" rx="22" fill="#fff" stroke="#e6e6e9" stroke-width="4"/>
