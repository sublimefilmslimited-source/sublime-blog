<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf2f2"/><stop offset="1" stop-color="#f5f5f6"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="180" fill="#d80707" opacity=".07"/>
  <polygon points="0,675 0,430 250,675" fill="#0b0b0c" opacity=".06"/>
  <!-- shelf -->
  <rect x="90" y="560" width="1020" height="24" rx="12" fill="#0b0b0c"/>
  <g font-family="Gilroy, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <!-- jar 1: management fee -->
    <rect x="175" y="200" width="170" height="34" rx="12" fill="#5d5f64"/>
    <path d="M160 240 h200 a20 20 0 0 1 20 20 v260 a40 40 0 0 1 -40 40 h-160 a40 40 0 0 1 -40 -40 v-260 a20 20 0 0 1 20 -20z" fill="#ffffff" stroke="#0b0b0c" stroke-width="6" opacity=".95"/>
    <g fill="#ffd27a" stroke="#a90505" stroke-width="3">
      <ellipse cx="220" cy="530" rx="38" ry="14"/><ellipse cx="300" cy="530" rx="38" ry="14"/>
      <ellipse cx="260" cy="510" rx="38" ry="14"/><ellipse cx="220" cy="490" rx="38" ry="14"/>
      <ellipse cx="300" cy="490" rx="38" ry="14"/><ellipse cx="260" cy="470" rx="38" ry="14"/>
    </g>
    <rect x="175" y="330" width="170" height="80" rx="12" fill="#0b0b0c"/>
    <text x="260" y="362" font-size="22" fill="#fff">Management</text>
    <text x="260" y="392" font-size="22" fill="#fff">fee</text>
    <!-- jar 2: ad spend -->
    <rect x="535" y="200" width="170" height="34" rx="12" fill="#5d5f64"/>
    <path d="M520 240 h200 a20 20 0 0 1 20 20 v260 a40 40 0 0 1 -40 40 h-160 a40 40 0 0 1 -40 -40 v-260 a20 20 0 0 1 20 -20z" fill="#ffffff" stroke="#0b0b0c" stroke-width="6" opacity=".95"/>
    <g fill="#ffd27a" stroke="#a90505" stroke-width="3">
      <ellipse cx="580" cy="530" rx="38" ry="14"/><ellipse cx="660" cy="530" rx="38" ry="14"/>
      <ellipse cx="620" cy="510" rx="38" ry="14"/><ellipse cx="580" cy="490" rx="38" ry="14"/>
    </g>
    <rect x="535" y="330" width="170" height="80" rx="12" fill="#d80707"/>
    <text x="620" y="380" font-size="26" fill="#fff">Ad spend</text>
    <!-- plus sign between -->
    <circle cx="440" cy="400" r="34" fill="#fff" stroke="#e6e6e9" stroke-width="4"/>
    <path d="M440 382 v36 M422 400 h36" stroke="#d80707" stroke-width="8" stroke-linecap="round"/>
    <!-- VAT tag -->
    <g transform="rotate(-10 700 200)">
      <path d="M640 150 h130 a12 12 0 0 1 12 12 v46 a12 12 0 0 1 -12 12 h-130 l-30 -35z" fill="#0b0b0c"/>
      <circle cx="634" cy="185" r="7" fill="#fdf2f2"/>
      <text x="710" y="196" font-size="24" fill="#ffd27a">+7.5% VAT</text>
    </g>
  </g>
  <!-- phone showing an ad -->
  <g>
    <rect x="850" y="150" width="210" height="390" rx="28" fill="#0b0b0c"/>
    <rect x="864" y="174" width="182" height="344" rx="14" fill="#fff"/>
    <circle cx="890" cy="200" r="14" fill="#d80707"/>
    <rect x="912" y="192" width="80" height="10" rx="5" fill="#0b0b0c"/>
    <rect x="912" y="207" width="50" height="7" rx="3.5" fill="#c9cacd"/>
    <rect x="876" y="226" width="158" height="158" rx="10" fill="#fdf2f2"/>
    <circle cx="955" cy="300" r="46" fill="#ffd27a"/>
    <path d="M920 340 C935 300 975 300 990 340 Z" fill="#2f8f5b"/>
    <rect x="876" y="398" width="110" height="10" rx="5" fill="#c9cacd"/>
    <rect x="876" y="416" width="140" height="10" rx="5" fill="#c9cacd"/>
    <rect x="876" y="450" width="158" height="44" rx="12" fill="#d80707"/>
    <rect x="916" y="466" width="78" height="12" rx="6" fill="#fff"/>
    <!-- arrow from ad jar to phone -->
    <path d="M760 300 C800 270 820 260 840 262" fill="none" stroke="#d80707" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 14"/>
    <polygon points="842,250 862,264 840,276" fill="#d80707"/>
  </g>
</svg>
